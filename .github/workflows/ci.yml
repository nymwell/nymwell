name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: CLI parses and prints help
        run: |
          node --check cli/bin/nymwell.mjs
          node cli/bin/nymwell.mjs --help
      - name: The CLI reports its package version
        run: grep -q "const VERSION = '$(node -p 'require("./cli/package.json").version')';" cli/bin/nymwell.mjs
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/nymwell/.claude-plugin/plugin.json cli/package.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done
      - name: The plugin pins a published CLI version
        run: |
          pinned=$(grep -o 'nymwell@[0-9][0-9.]*' plugins/nymwell/skills/domains/SKILL.md | sort -u)
          test "$(echo "$pinned" | wc -l)" -eq 1
          npm view "$pinned" version
